name: Continuous Integration
 
on: 
  pull_request:
    branches:
      - master
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
   
    services:
      postgres:
        image: postgres
        env:
         POSTGRES_USER: anis
         POSTGRES_PASSWORD: 15200315
         POSTGRES_DB: openmusic_test
         
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
 
    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
    - name: npm install migrate and test
      run: |
        npm install
        npx prisma generate
        npm run migrate up
        npm run test
      env:
        CI: true
        HOST: localhost
        PORT: 3000
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: anis
        PGPASSWORD: 15200315
        PGDATABASE: openmusic_test
        # Jest sets NODE_ENV=test, so pool.ts reads PG*_TEST and Prisma reads DATABASE_URL_TEST
        PGHOST_TEST: localhost
        PGPORT_TEST: 5432
        PGUSER_TEST: anis
        PGPASSWORD_TEST: 15200315
        PGDATABASE_TEST: openmusic_test
        DATABASE_URL: postgresql://anis:15200315@localhost:5432/openmusic_test
        DATABASE_URL_TEST: postgresql://anis:15200315@localhost:5432/openmusic_test
        ACCESS_TOKEN_KEY: secret
        REFRESH_TOKEN_KEY: terces
        ACCESS_TOKEN_AGE: 3600